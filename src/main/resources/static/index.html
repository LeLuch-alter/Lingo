<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lingo</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="topbar">LINGO</div>

  <div class="auth-container" id="authContainer">
    <div class="auth-box">
      <h2>Регистрация</h2>
      <input type="text" id="username" placeholder="Имя пользователя" />
      <div class="status" id="userStatus"></div>
      <input type="password" id="password" placeholder="Пароль" />
      <div class="status" id="passStatus"></div>
      <button id="registerBtn">Зарегистрироваться</button>
    </div>
  </div>

  <div class="app" id="app" style="display:none;">
    <div class="sidebar">
      <h3>Группы</h3>
      <div class="chat-item"></div>
      <div class="chat-item"></div>
      <div class="chat-item"></div>
      <div class="chat-item"></div>
    </div>

    <div class="chat">
      <div class="chat-header">
        <div class="chat-header-left">
          <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="avatar" />
        </div>
        <button class="settings-btn" id="settingsBtn">
          <img src="https://cdn-icons-png.flaticon.com/512/3524/3524659.png" alt="⚙️">
        </button>
      </div>

      <div class="chat-body" id="chatBody"></div>

      <div class="chat-input">
        <input type="text" id="messageInput" placeholder="Введите текст..." />
        <button id="sendBtn">Отправить</button>
      </div>
    </div>
  </div>

  <script src="functional.js"></script>
</body>
</html>
